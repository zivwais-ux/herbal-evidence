[project]
name = "herbal-evidence-backend"
version = "0.1.0"
description = "Herbal Evidence API: request lifecycle, researcher review, AI-assisted evidence drafts"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "supabase>=2.9",
  "pyjwt[crypto]>=2.9",
  "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
